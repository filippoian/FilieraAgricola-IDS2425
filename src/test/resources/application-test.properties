# --- CONFIG PER I TEST (H2 IN MEMORIA) ---

# Usiamo H2 così non dobbiamo configurare un DB vero ogni volta che facciamo i test.
# 'testdb' è il nome del DB, e DB_CLOSE_DELAY=-1 serve a non far sparire i dati
# finché non abbiamo finito tutti i test.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Serve per far capire a Hibernate che siamo su H2, altrimenti fa casino con le query.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Ogni volta che facciamo partire i test, Hibernate pialla tutto e ricrea lo schema.
# È il modo migliore per evitare che i test si influenzino a vicenda con dati vecchi.
spring.jpa.hibernate.ddl-auto=create-drop